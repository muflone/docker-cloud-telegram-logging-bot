services:
  app:
    container_name: telegram-logging-bot
    image: ilmuflone/telegram-logging-bot:0.7.0
    restart: unless-stopped
    networks:
      - default
    env_file:
      - ./app.env
    volumes:
      - ./data:/app/data

networks:
  default:
    name: telegram-logging-bot
    driver: bridge
    enable_ipv6: false

